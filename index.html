<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0017C1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>買い物リスト</title>
<style>
/* デジタル庁デザインシステム風の配色（色コードは要確認：公式の最新値と照合すること） */
:root {
  --primary: #0017C1;       /* プライマリ（青） */
  --primary-hover: #00118F;
  --primary-light: #E8F1FE; /* 追加済み候補の背景 */
  --text: #1A1A1A;
  --text-sub: #4D4D4D;
  --border: #767676;
  --bg: #FFFFFF;
  --bg-sub: #F2F2F2;
  --danger: #EC0000;
  --focus: #FFD43D;         /* フォーカス用の黄色 */
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg-sub); color: var(--text);
  font-family: "Noto Sans JP", sans-serif; font-size: 18px; line-height: 1.7;
}
[hidden] { display: none !important; }
header {
  position: sticky; top: 0; z-index: 2; background: var(--primary); color: #fff;
  padding: 8px 16px; display: flex; align-items: center; gap: 8px; min-height: 60px;
}
header h1 { margin: 0; font-size: 22px; flex: 1; }
header button { background: transparent; border-color: #fff; color: #fff; min-height: 44px; padding: 4px 12px; font-size: 16px; }
header button:hover { background: var(--primary-hover); }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 110px; }
button {
  min-height: 48px; padding: 8px 16px; font-size: 18px; font-weight: 700; font-family: inherit;
  border-radius: 8px; border: 2px solid var(--primary);
  background: var(--primary); color: #fff; cursor: pointer;
}
button:hover { background: var(--primary-hover); }
button.sub { background: var(--bg); color: var(--primary); }
button.danger { background: var(--bg); color: var(--danger); border-color: var(--danger); }
button:disabled { opacity: .4; cursor: default; }
/* キーボード・タッチ操作時の視認性（黄色リング＋黒アウトライン） */
:focus-visible { outline: 4px solid #000; outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus); }
input[type=text], textarea, select {
  width: 100%; min-height: 48px; padding: 8px 12px; font-size: 18px; font-family: inherit;
  border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
}
h2 { font-size: 20px; margin: 24px 0 8px; }
h3 { font-size: 18px; margin: 16px 0 8px; padding-left: 8px; border-left: 6px solid var(--primary); }
.hint { color: var(--text-sub); font-size: 16px; margin: 0 0 12px; }
.msg { color: var(--danger); font-weight: 700; margin: 0 0 12px; }

/* ① リスト画面 */
ul { list-style: none; margin: 0; padding: 0; }
.row {
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 4px 4px 12px; margin-bottom: 8px;
}
.row label { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; }
.row input[type=checkbox] { width: 28px; height: 28px; flex: none; accent-color: var(--primary); }
.row.done { background: var(--bg-sub); }
.row.done .name { text-decoration: line-through; color: var(--text-sub); }
.badge { color: var(--text-sub); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; font-size: 14px; }
.x { background: transparent; border: none; color: var(--text-sub); min-width: 48px; padding: 0; font-size: 24px; font-weight: 400; }
.x:hover { background: var(--bg-sub); }
.empty { background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; padding: 24px 16px; text-align: center; color: var(--text-sub); }
.footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  background: var(--bg-sub); border-top: 1px solid #ccc; padding: 12px 16px;
}
.footer button { display: block; width: 100%; max-width: 608px; margin: 0 auto; min-height: 60px; font-size: 20px; border-radius: 30px; }

/* ② 追加画面 */
#searchForm { margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--bg); color: var(--primary); font-weight: 400; border-radius: 24px; padding: 4px 16px; }
.chip.on { background: var(--primary-light); color: var(--primary); font-weight: 700; }
.newbox { background: var(--bg); border: 2px solid var(--primary); border-radius: 8px; padding: 12px; margin: 16px 0; }
.newbox p { margin: 0 0 8px; font-weight: 700; }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 3;
  background: #1A1A1A; color: #fff; padding: 8px 20px; border-radius: 24px; font-size: 16px; white-space: nowrap;
}

/* ③ 設定画面 */
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.card h2 { margin-top: 0; }
.card code { font-size: 20px; font-weight: 700; word-break: break-all; }
.card .row { padding-left: 12px; }
.card .row span { flex: 1; }
.stack > * + * { margin-top: 8px; }
</style>
</head>
<body>

<!-- ① いつもの画面（買うもの一覧） -->
<section id="view-list">
  <header>
    <h1>買い物リスト</h1>
    <button type="button" id="goSettings">設定</button>
  </header>
  <main>
    <p class="msg" id="msg" role="alert"></p>
    <ul id="list"></ul>
    <p class="hint" style="margin-top:16px">買ったら、品物をタップしてチェック。もう一度タップで取り消し。チェックしたものは1日で消えます。</p>
  </main>
  <div class="footer"><button type="button" id="goAdd">＋ 買うものを追加</button></div>
</section>

<!-- ② 追加画面 -->
<section id="view-add" hidden>
  <header>
    <button type="button" class="back">← もどる</button>
    <h1>買うものを追加</h1>
  </header>
  <main>
    <form id="searchForm">
      <input type="text" id="search" placeholder="さがす・新しく入力" aria-label="品物をさがす、または入力" autocomplete="off">
    </form>
    <div id="addBody"></div>
  </main>
  <div class="footer"><button type="button" class="back sub">リストにもどる</button></div>
</section>

<!-- ③ 設定画面 -->
<section id="view-settings" hidden>
  <header>
    <button type="button" class="back">← もどる</button>
    <h1>設定</h1>
  </header>
  <main>
    <div class="card stack">
      <h2>家族と共有</h2>
      <p class="hint">同じ家族コードの端末どうしで、リストが共有されます。</p>
      <p>家族コード：<code id="code"></code></p>
      <button type="button" id="share">家族に共有リンクを送る</button>
      <button type="button" class="sub" id="changeCode">家族コードを入力・変更</button>
    </div>
    <div class="card">
      <h2>分類の順番</h2>
      <p class="hint">↑↓で入れ替えます。家族全員の画面に反映されます。</p>
      <ul id="orderList"></ul>
    </div>
    <div class="card stack">
      <h2>よく買うものの登録</h2>
      <p class="hint">分類を選び、1行に1つずつ入力して登録します。</p>
      <select id="bulkCat" aria-label="登録する分類"></select>
      <textarea id="bulk" rows="4" placeholder="牛乳&#10;卵&#10;納豆" aria-label="登録する品物"></textarea>
      <button type="button" id="bulkAdd">登録する</button>
      <h2>登録済み（不要なものは削除）</h2>
      <div id="candList"></div>
    </div>
    <div class="card stack">
      <h2>チェック済みの品物</h2>
      <p class="hint">1日たつと自動で消えます。すぐ消したいときはこちら。</p>
      <button type="button" class="danger" id="clear">チェック済みをすべて削除</button>
    </div>
  </main>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
// 家族共有版：Firestoreにリアルタイム同期。構成は lists/{家族コード}/items・freq・meta
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; // バージョン要確認
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, updateDoc, deleteDoc,
  setDoc, increment, onSnapshot, query, orderBy, serverTimestamp, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const $ = (id) => document.getElementById(id);
const msg = (t) => { $("msg").textContent = t; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const CODE_KEY = "family-code";

// ---------- 画面の切り替え（スマホの「戻る」ボタンでも戻れるように #add / #settings を使う） ----------
let movedInApp = false;
function route() {
  const v = location.hash === "#add" ? "add" : location.hash === "#settings" ? "settings" : "list";
  for (const name of ["list", "add", "settings"]) $("view-" + name).hidden = name !== v;
  window.scrollTo(0, 0);
  if (v === "add") { $("search").value = ""; }
  render();
}
window.addEventListener("hashchange", route);
const go = (hash) => { movedInApp = true; location.hash = hash; };
const back = () => {
  if (movedInApp) history.back();
  else { history.replaceState(null, "", location.pathname); route(); }
};
$("goAdd").onclick = () => go("#add");
$("goSettings").onclick = () => go("#settings");
document.querySelectorAll(".back").forEach((b) => (b.onclick = back));

// 追加したことを画面下に少しだけ表示
let toastTimer;
function toast(t) {
  const e = $("toast"); e.textContent = t; e.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (e.hidden = true), 1500);
}

// ---------- 家族コード：初回は推測されにくい12文字を自動生成 ----------
let familyCode = "";
try { familyCode = localStorage.getItem(CODE_KEY) || ""; } catch (e) {}
// 共有リンク（?code=xxxx）で開かれた場合は、そのコードで参加する
const CODE_RE = /^[a-z0-9]{8,32}$/;
const linkCode = new URLSearchParams(location.search).get("code");
if (linkCode && CODE_RE.test(linkCode) && linkCode !== familyCode) {
  if (confirm("家族の買い物リストに参加しますか？")) {
    familyCode = linkCode;
    try { localStorage.setItem(CODE_KEY, familyCode); } catch (e) {}
  }
}
if (linkCode) history.replaceState(null, "", location.pathname + location.hash); // コードをアドレス欄に残さない
if (!familyCode) {
  const chars = "abcdefghijkmnpqrstuvwxyz23456789";
  const buf = crypto.getRandomValues(new Uint8Array(12));
  familyCode = Array.from(buf, (b) => chars[b % chars.length]).join("");
  try { localStorage.setItem(CODE_KEY, familyCode); } catch (e) {}
}
$("code").textContent = familyCode;
$("share").onclick = async () => {
  const url = location.origin + location.pathname + "?code=" + familyCode;
  try {
    if (navigator.share) { await navigator.share({ title: "買い物リスト", text: "家族の買い物リストに参加してね", url }); return; }
    await navigator.clipboard.writeText(url);
    alert("共有リンクをコピーしました。家族に送ってください。");
  } catch (e) { if (e.name !== "AbortError") prompt("このリンクを家族に送ってください", url); }
};
$("changeCode").onclick = () => {
  const v = (prompt("家族のスマホに表示されている家族コードを入力", "") || "").trim();
  if (!CODE_RE.test(v)) { if (v) alert("コードは英小文字と数字の8〜32文字です"); return; }
  try { localStorage.setItem(CODE_KEY, v); } catch (e) {}
  location.reload();
};

// ---------- 分類と表示数 ----------
const CATS = ["食品", "日用品", "ネット注文", "会社", "おたえ", "その他"]; // 分類見出し。変更はここを書き換える
const catOf = (c) => (CATS.includes(c) ? c : "その他");
let catOrder = [...CATS];   // 表示順。家族で共有（lists/{家族コード}/meta/order）
// 保存済みの並び順に、あとから増やした分類を差し込む（CATSで直前にある分類のすぐ下へ。例：おたえ→会社の下）
function mergeOrder(saved) {
  const order = [...saved];
  CATS.forEach((c, i) => {
    if (order.includes(c)) return;
    const prev = CATS.slice(0, i).reverse().find((p) => order.includes(p));
    order.splice(prev ? order.indexOf(prev) + 1 : 0, 0, c);
  });
  return order;
}
const PER_CAT = 6;         // 追加画面で1つの分類に出す候補の数（多すぎると探すのが面倒なので6個）
const DONE_KEEP_MS = 24 * 60 * 60 * 1000; // 済にしてから1日で自動削除
const freqKey = (name) => name.replace(/\//g, "／");   // 候補の文書IDは名前（"/" だけ全角に）
const tsMs = (t) => (t && t.toMillis ? t.toMillis() : Date.now()); // 書き込み直後(null)は現在時刻扱い
const byUse = (a, b) => (b.count - a.count) || (tsMs(b.last) - tsMs(a.last)); // 使用回数の多い順→最近使った順

// ---------- Firebase 接続 ----------
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }), // 電波が弱くても動く＋複数タブ対応
});
let items = [];
let freq = [];
let itemsCol, freqCol, orderRef;

try {
  await signInAnonymously(getAuth(app));   // 匿名ログイン（アカウント作成不要）
  itemsCol = collection(db, "lists", familyCode, "items");
  freqCol = collection(db, "lists", familyCode, "freq");
  orderRef = doc(db, "lists", familyCode, "meta", "order");
  onSnapshot(query(itemsCol, orderBy("createdAt")), (snap) => {
    items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    cleanup();
    render();
  }, (e) => msg("同期エラー：" + e.code));
  onSnapshot(orderRef, (d) => {
    const saved = (d.exists() && Array.isArray(d.data().cats)) ? d.data().cats.filter((c) => CATS.includes(c)) : [];
    catOrder = mergeOrder([...new Set(saved)]);
    render();
  }, (e) => msg("同期エラー：" + e.code));
  onSnapshot(freqCol, (snap) => {
    freq = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }, (e) => msg("同期エラー：" + e.code));
} catch (e) {
  msg("接続エラー：" + (e.code || e.message));
}

// 済にして1日たった品物を削除。doneAtが無い古い済み品は今を起点にする
function cleanup() {
  const now = Date.now();
  items.forEach((it) => {
    if (!it.done) return;
    if (!it.doneAt) { updateDoc(doc(itemsCol, it.id), { doneAt: serverTimestamp() }).catch(() => {}); return; }
    if (now - tsMs(it.doneAt) > DONE_KEEP_MS) deleteDoc(doc(itemsCol, it.id)).catch(() => {});
  });
}

// 品物を追加（リストにあれば重複させず、済なら未チェックに戻す）。使用回数も加算
function addItem(name, cat) {
  name = name.trim();
  cat = catOf(cat);
  if (!name || !itemsCol) return;
  const same = items.find((it) => it.name === name);
  if (same) {
    if (same.done) updateDoc(doc(itemsCol, same.id), { done: false, doneAt: null }).catch((e) => msg("更新失敗：" + e.code));
  } else {
    addDoc(itemsCol, { name, cat, done: false, createdAt: serverTimestamp() }).catch((e) => msg("追加失敗：" + e.code));
  }
  setDoc(doc(freqCol, freqKey(name)), { name, cat, count: increment(1), last: serverTimestamp() }, { merge: true })
    .catch((e) => msg("候補の保存失敗：" + e.code));
  toast("「" + name + "」を追加しました");
}

// ---------- 描画 ----------
function render() {
  renderList();
  if (!$("view-add").hidden) renderAdd();
  if (!$("view-settings").hidden) renderSettings();
}

// ① リスト画面：分類ごとに、追加した順に並べる
function renderList() {
  const ul = $("list");
  ul.replaceChildren();
  if (items.length === 0) {
    const li = el("li", "empty", "リストは空です。下の「＋ 買うものを追加」から追加してください。");
    ul.append(li);
    return;
  }
  catOrder.forEach((c) => {
    const inCat = items.filter((it) => catOf(it.cat) === c);
    if (inCat.length === 0) return;
    const head = el("li"); head.append(el("h3", null, c)); ul.append(head);
    // チェックしても場所は動かさない（同じ場所をもう一度押せば取り消せるように）
    inCat.forEach((it) => {
      const li = el("li", "row" + (it.done ? " done" : ""));
      const label = el("label");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = !!it.done;
      cb.onchange = () => updateDoc(doc(itemsCol, it.id),
        cb.checked ? { done: true, doneAt: serverTimestamp() } : { done: false, doneAt: null })
        .catch((e) => msg("更新失敗：" + e.code));
      label.append(cb, el("span", "name", it.name));   // textContentでXSS回避
      if (it.done) label.append(el("span", "badge", "済"));
      const del = el("button", "x", "×");
      del.type = "button"; del.setAttribute("aria-label", it.name + "をリストから消す");
      del.onclick = () => deleteDoc(doc(itemsCol, it.id)).catch((e) => msg("削除失敗：" + e.code));
      li.append(label, del);
      ul.append(li);
    });
  });
}

// ② 追加画面：分類ごとによく買うものを並べる。入力すると絞り込み、無ければ新しく追加
function chipFor(f, active) {
  const on = active.has(f.name);
  const b = el("button", "chip" + (on ? " on" : ""), (on ? "✓ " : "＋ ") + f.name);
  b.type = "button";
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.onclick = () => { if (!active.has(f.name)) addItem(f.name, f.cat); else toast("「" + f.name + "」はリストにあります"); };
  return b;
}
function renderAdd() {
  const box = $("addBody");
  box.replaceChildren();
  const q = $("search").value.trim();
  const active = new Set(items.filter((it) => !it.done).map((it) => it.name));

  if (q) {
    const hits = freq.filter((f) => f.name.includes(q)).sort(byUse).slice(0, 12);
    if (hits.length) {
      box.append(el("h3", null, "候補"));
      const chips = el("div", "chips"); hits.forEach((f) => chips.append(chipFor(f, active))); box.append(chips);
    }
    if (!freq.some((f) => f.name === q)) {
      const nb = el("div", "newbox");
      nb.append(el("p", null, "「" + q + "」を新しく追加。どの分類に入れますか？"));
      const chips = el("div", "chips");
      catOrder.forEach((c) => {
        const b = el("button", "sub", c); b.type = "button";
        b.onclick = () => { addItem(q, c); $("search").value = ""; renderAdd(); };
        chips.append(b);
      });
      nb.append(chips); box.append(nb);
    }
    return;
  }

  if (freq.length === 0) {
    box.append(el("p", "hint", "よく買うものはまだありません。上の欄に入力して追加すると、次からここに並びます。"));
    return;
  }
  box.append(el("p", "hint", "タップするとリストに入ります。よく買う順に並んでいます。"));
  catOrder.forEach((c) => {
    const list = freq.filter((f) => catOf(f.cat) === c).sort(byUse).slice(0, PER_CAT);
    if (!list.length) return;
    box.append(el("h3", null, c));
    const chips = el("div", "chips"); list.forEach((f) => chips.append(chipFor(f, active))); box.append(chips);
  });
  box.append(el("p", "hint", "見つからないときは、上の欄に入力してください。"));
}
$("search").addEventListener("input", renderAdd);
$("searchForm").onsubmit = (e) => {
  e.preventDefault();
  const q = $("search").value.trim();
  const hit = freq.find((f) => f.name === q);
  if (hit) { addItem(hit.name, hit.cat); $("search").value = ""; renderAdd(); }
  else $("search").blur();   // 新しい品物は分類を選んでもらう
};

// ③ 設定画面
function renderSettings() {
  // 分類の順番
  const ol = $("orderList");
  ol.replaceChildren();
  catOrder.forEach((c, i) => {
    const li = el("li", "row");
    li.append(el("span", null, c));
    const mk = (label, dir) => {
      const b = el("button", "sub", label);
      b.type = "button";
      b.setAttribute("aria-label", c + "を" + (dir < 0 ? "上へ" : "下へ"));
      b.disabled = i + dir < 0 || i + dir >= catOrder.length;
      b.onclick = () => {
        const next = [...catOrder];
        [next[i], next[i + dir]] = [next[i + dir], next[i]];
        catOrder = next; render();
        setDoc(orderRef, { cats: next }).catch((e) => msg("並び順の保存失敗：" + e.code));
      };
      return b;
    };
    li.append(mk("↑", -1), mk("↓", 1));
    ol.append(li);
  });

  // 候補登録の分類（選択中の値は保つ）
  const sel = $("bulkCat");
  const cur = sel.value;
  sel.replaceChildren(...catOrder.map((c) => { const o = el("option", null, c); o.value = c; return o; }));
  if (catOrder.includes(cur)) sel.value = cur;

  // 登録済みの候補（分類ごと）
  const cl = $("candList");
  cl.replaceChildren();
  if (freq.length === 0) cl.append(el("p", "hint", "まだありません。"));
  catOrder.forEach((c) => {
    const list = freq.filter((f) => catOf(f.cat) === c).sort(byUse);
    if (!list.length) return;
    cl.append(el("h3", null, c));
    const ul = el("ul");
    list.forEach((f) => {
      const li = el("li", "row");
      li.append(el("span", null, f.name));
      const d = el("button", "danger", "削除"); d.type = "button";
      d.onclick = () => deleteDoc(doc(freqCol, f.id)).catch((e) => msg("削除失敗：" + e.code));
      li.append(d); ul.append(li);
    });
    cl.append(ul);
  });
}
$("bulkAdd").onclick = () => {
  const box = $("bulk");
  const names = [...new Set(box.value.split("\n").map((s) => s.trim()).filter(Boolean))];
  const cat = catOf($("bulkCat").value);
  names.forEach((name) =>
    setDoc(doc(freqCol, freqKey(name)), { name, cat, count: increment(1), last: serverTimestamp() }, { merge: true })
      .catch((e) => msg("候補の保存失敗：" + e.code)));
  box.value = "";
  if (names.length) toast(names.length + "件 登録しました");
};
$("clear").onclick = () => {
  const done = items.filter((it) => it.done);
  if (!done.length) { toast("チェック済みはありません"); return; }
  if (!confirm("チェック済み " + done.length + "件を削除しますか？")) return;
  const batch = writeBatch(db);
  done.forEach((it) => batch.delete(doc(itemsCol, it.id)));
  batch.commit().catch((e) => msg("削除失敗：" + e.code));
};

route();
</script>
</body>
</html>
